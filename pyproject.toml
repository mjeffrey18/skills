# Editor settings for the Python scripts in these skills. Not a package: nothing here is installed.

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Long lines there are handoff template text; wrapping them would change the files it writes.
"skills/handoff/scripts/handoff.py" = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
